name: 'Terraform Deploy'

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write # WAJIB untuk meminta token OIDC AWS
  contents: read  # WAJIB untuk membaca repositori Git

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Autentikasi aman menggunakan OIDC Role
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::088066170395:user/Engineer-Najip # Sesuaikan dengan ARN Role Anda
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan
